<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio to MIDI - 音声→MIDI変換</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 520px;
            width: 100%;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
            color: #fff;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .upload-area {
            border: 2px dashed #444;
            border-radius: 12px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            background: #1a1a2e;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #6c63ff;
            background: #1f1f3a;
        }
        .upload-area input[type="file"] { display: none; }
        .upload-icon { font-size: 2.5rem; margin-bottom: 0.8rem; }
        .upload-text { color: #aaa; font-size: 0.9rem; }
        .file-name {
            margin-top: 0.8rem;
            color: #6c63ff;
            font-weight: 500;
            word-break: break-all;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 0.9rem;
            margin-top: 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary {
            background: #6c63ff;
            color: #fff;
        }
        .btn-primary:hover { background: #5a52d5; }
        .btn-primary:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        .btn-download {
            background: #2ecc71;
            color: #fff;
            text-decoration: none;
            text-align: center;
        }
        .btn-download:hover { background: #27ae60; }
        .status {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        .status.error { color: #e74c3c; }
        .status.processing { color: #f39c12; }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #f39c12;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 0.4rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .result { margin-top: 1.5rem; }
        .formats {
            text-align: center;
            margin-top: 1rem;
            color: #666;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Audio to MIDI</h1>
        <p class="subtitle">音声ファイルをAIが解析してMIDIに変換します</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">🎵</div>
            <div class="upload-text">クリックまたはドラッグ＆ドロップでファイルを選択</div>
            <input type="file" id="fileInput" accept=".mp3,.wav">
            <div class="file-name" id="fileName"></div>
        </div>

        <button class="btn btn-primary" id="convertBtn" disabled>MIDIに変換</button>

        <div class="status" id="status"></div>
        <div class="result" id="result"></div>

        <div class="formats">対応形式: MP3, WAV</div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const convertBtn = document.getElementById('convertBtn');
        const status = document.getElementById('status');
        const result = document.getElementById('result');

        let selectedFile = null;

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                selectFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                selectFile(fileInput.files[0]);
            }
        });

        function selectFile(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            if (!['mp3', 'wav'].includes(ext)) {
                status.textContent = 'MP3またはWAVファイルを選択してください';
                status.className = 'status error';
                return;
            }
            selectedFile = file;
            fileName.textContent = file.name;
            convertBtn.disabled = false;
            status.textContent = '';
            result.innerHTML = '';
        }

        convertBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            convertBtn.disabled = true;
            status.innerHTML = '<span class="spinner"></span>変換中... しばらくお待ちください';
            status.className = 'status processing';
            result.innerHTML = '';

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const response = await fetch('/api/transcribe', {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Transcription failed');
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const name = selectedFile.name.replace(/\.[^.]+$/, '.mid');

                result.innerHTML = `<a class="btn btn-download" href="${url}" download="${name}">MIDIファイルをダウンロード</a>`;
                status.textContent = '変換完了!';
                status.className = 'status';
            } catch (err) {
                status.textContent = `エラー: ${err.message}`;
                status.className = 'status error';
            } finally {
                convertBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
