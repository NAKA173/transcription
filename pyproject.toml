[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transcription"
version = "0.1.0"
description = "Audio-to-MIDI transcription web application powered by AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "python-multipart>=0.0.6",
    "basic-pitch>=0.4.0",
    "pretty-midi>=0.2.9",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
separation = [
    "demucs>=4.0.0",
    "torchaudio>=2.0.0",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "numpy>=1.18",
    "scipy>=1.4.1",
    "pytest-asyncio>=0.21.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
